# Redraws the contribution snake once a day in the brand colours and commits it to images/snake/.
name: Contribution snake
on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            images/snake/snake-dark.svg?palette=github-dark&color_snake=#B59A6A&color_dots=#1c1517,#4E1722,#7D2A38,#9A2E3A,#C2475A
            images/snake/snake-light.svg?color_snake=#7D2A38&color_dots=#ece9e2,#e4c4c9,#c98a95,#9A2E3A,#4E1722
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/snake
          git diff --cached --quiet || { git commit -m "Update contribution snake"; git push; }
